[project]
name = "weight-space-programming-sellma"
version = "0.1.0"
description = "Investigating Weight-Space Programming for Swedish Language Models (SE.LLMA)"
authors = [
    { name = "Felix Suarez" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
    "sentencepiece>=0.2.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
    "tabulate>=0.9.0",
    "markdown-it-py>=3.0.0",
    "huggingface-hub>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
